<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>زكزك سوري</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    body {
      font-family: "Aref Ruqaa", serif;
    }

    /* شاشة الافتتاح */
    .opening {
      position: relative;
      width: 100vw;
      height: 100vh;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.08)
        ),
        url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRLh2yUrsPS6WAyQyFSYGQ2OI-MFtmrQ4kf_w6hnFsm4g&s=10");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* طبقة خفيفة فوق الصورة */
    .shade {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.08);
    }

    /* المستطيل الأبيض */
    .title-box {
      position: relative;
      z-index: 2;

      background: #ffffff;
      color: #000000;

      padding: 20px 48px;
      min-width: 300px;

      border-radius: 24px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.25);

      transform: rotate(-4deg);

      animation: titleAppear 1.4s ease-out forwards;
    }

    /* اسم اللعبة */
    .title {
      margin: 0;

      font-size: clamp(45px, 9vw, 90px);
      font-weight: 700;

      line-height: 1;
      white-space: nowrap;

      color: #000000;
    }

    /* حركة ظهور العنوان */
    @keyframes titleAppear {

      0% {
        opacity: 0;
        transform:
          rotate(-8deg)
          scale(0.75)
          translateY(40px);
      }

      70% {
        opacity: 1;
        transform:
          rotate(-4deg)
          scale(1.05)
          translateY(0);
      }

      100% {
        opacity: 1;
        transform:
          rotate(-4deg)
          scale(1)
          translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="opening">

    <div class="shade"></div>

    <div class="title-box">
      <h1 class="title">زكزك سوري</h1>
    </div>

  </div>

</body>
</html>
