<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>زكزك سوري!</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap');

*{box-sizing:border-box}

:root{
  --bg:#efe4cf;
  --card:#fffaf0;
  --dark:#241b15;
  --brown:#5b3925;
  --gold:#d69b32;
  --green:#47734d;
  --red:#a64235;
  --shadow:0 12px 35px rgba(0,0,0,.22);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
}

body{
  font-family:"Aref Ruqaa",serif;
  color:var(--dark);
}

button{
  font-family:inherit;
  cursor:pointer;
}

.hidden{display:none!important}

/* =========================
   الافتتاح
========================= */

.opening{
  position:fixed;
  inset:0;
  z-index:1000;
  background:
    linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08)),
    url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRLh2yUrsPS6WAyQyFSYGQ2OI-MFtmrQ4kf_w6hnFsm4g&s=10");
  background-size:cover;
  background-position:center;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:opacity .7s;
}

.opening.hide{
  opacity:0;
  pointer-events:none;
}

.shade{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.12);
}

.title-box{
  position:relative;
  z-index:2;
  background:#fff;
  color:#000;
  padding:20px 48px;
  min-width:300px;
  border-radius:24px;
  box-shadow:var(--shadow);
  transform:rotate(-4deg);
  animation:titleAppear 1.4s ease-out forwards;
}

.title{
  margin:0;
  font-size:clamp(45px,9vw,90px);
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}

@keyframes titleAppear{
  0%{opacity:0;transform:rotate(-8deg) scale(.75) translateY(40px)}
  70%{opacity:1;transform:rotate(-4deg) scale(1.05)}
  100%{opacity:1;transform:rotate(-4deg) scale(1)}
}

/* =========================
   التطبيق
========================= */

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background-size:cover;
  background-position:center;
  transition:background-image .4s;
}

.app-overlay{
  position:absolute;
  inset:0;
  background:rgba(250,244,232,.72);
  pointer-events:none;
}

.screen{
  position:absolute;
  inset:0;
  z-index:2;
}

/* =========================
   الرئيسية
========================= */

.home{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.game-name{
  font-size:clamp(52px,10vw,105px);
  margin:0 0 35px;
  font-weight:700;
  text-shadow:3px 4px 0 rgba(255,255,255,.8);
}

.start-btn{
  border:0;
  background:var(--dark);
  color:#fff;
  font-size:clamp(28px,5vw,48px);
  padding:14px 70px;
  border-radius:22px;
  box-shadow:var(--shadow);
  transition:.2s;
}

.start-btn:hover{
  transform:scale(1.05);
}

/* =========================
   أزرار الزوايا
========================= */

.corner-btn{
  position:absolute;
  top:22px;
  z-index:10;
  border:0;
  background:rgba(255,250,240,.95);
  color:var(--dark);
  border-radius:18px;
  padding:10px 18px;
  box-shadow:0 7px 20px rgba(0,0,0,.15);
  font-size:22px;
  display:flex;
  gap:8px;
  align-items:center;
}

.shop-btn{right:22px}
.tasks-btn{left:22px}

.coin-box{
  position:absolute;
  top:25px;
  right:50%;
  transform:translateX(50%);
  z-index:10;
  background:var(--dark);
  color:#fff;
  border-radius:18px;
  padding:8px 20px;
  font-size:21px;
}

/* =========================
   النوافذ
========================= */

.modal{
  position:absolute;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-card{
  width:min(900px,95vw);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border-radius:28px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  position:relative;
}

.modal-title{
  margin:0 0 20px;
  font-size:40px;
  text-align:center;
}

.close-btn{
  position:absolute;
  left:18px;
  top:15px;
  border:0;
  background:var(--red);
  color:#fff;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:24px;
}

/* =========================
   المتجر
========================= */

.shop-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:18px;
}

.shop-item{
  background:#fff;
  border-radius:22px;
  padding:12px;
  box-shadow:0 7px 20px rgba(0,0,0,.13);
  text-align:center;
}

.shop-item img{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  border-radius:17px;
}

.shop-item h3{
  margin:8px 0;
  font-size:24px;
}

.buy-btn{
  width:100%;
  border:0;
  background:var(--gold);
  color:#241b15;
  border-radius:14px;
  padding:9px;
  font-size:20px;
}

.buy-btn.owned{
  background:var(--green);
  color:white;
}

/* =========================
   المهام
========================= */

.task{
  background:white;
  border-radius:18px;
  padding:15px;
  margin:12px 0;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.task-title{
  font-size:23px;
  margin-bottom:5px;
}

.task-progress{
  height:12px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
}

.task-progress div{
  height:100%;
  background:var(--green);
}

/* =========================
   شاشة المراحل
========================= */

.stage-screen{
  padding:30px;
  overflow:auto;
}

.stage-title{
  text-align:center;
  font-size:46px;
  margin:15px 0 25px;
}

.stage-grid{
  width:min(1000px,95vw);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.stage-btn{
  border:0;
  min-height:100px;
  border-radius:22px;
  background:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
  font-size:30px;
  transition:.2s;
}

.stage-btn:hover{
  transform:translateY(-4px);
}

.stage-btn.locked{
  filter:grayscale(1);
  opacity:.45;
}

.stage-btn.done{
  background:#d8ead8;
}

/* =========================
   شاشة السؤال
========================= */

.question-screen{
  padding:20px;
  overflow:auto;
}

.question-top{
  width:min(1100px,95vw);
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.back-btn{
  border:0;
  background:rgba(255,255,255,.9);
  border-radius:14px;
  padding:8px 17px;
  font-size:20px;
}

.timer{
  width:72px;
  height:72px;
  border-radius:50%;
  background:var(--dark);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);
}

.question-card{
  width:min(1100px,95vw);
  margin:18px auto 40px;
  background:rgba(255,250,240,.97);
  border-radius:30px;
  padding:25px;
  box-shadow:var(--shadow);
}

.question-text{
  font-size:clamp(28px,5vw,45px);
  text-align:center;
  margin:5px 0 20px;
}

.answers{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.answer-btn{
  border:3px solid transparent;
  background:#fff;
  border-radius:20px;
  padding:15px;
  font-size:25px;
  box-shadow:0 5px 14px rgba(0,0,0,.12);
  min-height:65px;
}

.answer-btn:hover{
  border-color:var(--gold);
}

.answer-btn.correct{
  background:#cce7cf;
  border-color:#47734d;
}

.answer-btn.wrong{
  background:#f2c9c4;
  border-color:#a64235;
}

.image-question{
  display:block;
  width:min(430px,90%);
  max-height:320px;
  object-fit:cover;
  margin:10px auto 22px;
  border-radius:50%;
  box-shadow:0 10px 25px rgba(0,0,0,.22);
}

.normal-image{
  border-radius:20px;
}

.music-controls{
  text-align:center;
  margin:8px 0 15px;
}

.music-btn{
  border:0;
  background:var(--dark);
  color:#fff;
  padding:9px 20px;
  border-radius:14px;
  font-size:19px;
}

/* =========================
   الكتابة
========================= */

.text-answer{
  width:100%;
  border:3px solid #ddd;
  border-radius:18px;
  padding:14px;
  font-family:inherit;
  font-size:26px;
  text-align:center;
  outline:none;
}

.submit-btn{
  display:block;
  margin:15px auto 0;
  border:0;
  background:var(--green);
  color:#fff;
  border-radius:16px;
  padding:10px 40px;
  font-size:24px;
}

/* =========================
   الصور
========================= */

.image-answers{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.image-answer{
  border:4px solid transparent;
  background:white;
  padding:7px;
  border-radius:50%;
  overflow:hidden;
  aspect-ratio:1;
}

.image-answer img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.image-answer.selected{
  border-color:var(--gold);
}

/* =========================
   السحب والتوصيل
========================= */

.match-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

.match-column{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.match-item{
  background:white;
  border:3px solid transparent;
  border-radius:50%;
  min-height:78px;
  padding:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-shadow:0 5px 15px rgba(0,0,0,.12);
  cursor:grab;
  user-select:none;
}

.match-image{
  width:90px;
  height:90px;
  padding:4px;
}

.match-image img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}

.match-item.dragging{
  opacity:.45;
}

.match-item.correct-match{
  background:#d4ead5;
  border-color:var(--green);
}

.match-item.wrong-match{
  background:#f2cccc;
  border-color:var(--red);
}

.match-submit{
  display:block;
  margin:20px auto 0;
  border:0;
  background:var(--green);
  color:#fff;
  padding:10px 35px;
  border-radius:15px;
  font-size:23px;
}

/* =========================
   ترتيب الأسماء
========================= */

.sort-list{
  width:min(600px,95%);
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.sort-item{
  background:#fff;
  border-radius:20px;
  padding:15px;
  text-align:center;
  font-size:27px;
  box-shadow:0 5px 15px rgba(0,0,0,.12);
  cursor:grab;
}

/* =========================
   نتيجة السؤال
========================= */

.result{
  text-align:center;
  font-size:28px;
  margin-top:18px;
  min-height:40px;
}

.result.good{color:var(--green)}
.result.bad{color:var(--red)}

.next-btn{
  display:block;
  margin:15px auto 0;
  border:0;
  background:var(--dark);
  color:#fff;
  padding:10px 40px;
  border-radius:16px;
  font-size:24px;
}

/* =========================
   responsive
========================= */

@media(max-width:700px){
  .stage-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .answers{
    grid-template-columns:1fr;
  }

  .image-answers{
    grid-template-columns:repeat(2,1fr);
  }

  .match-layout{
    grid-template-columns:1fr;
  }

  .corner-btn{
    font-size:18px;
    padding:8px 12px;
  }

  .coin-box{
    top:80px;
  }
}
</style>
</head>

<body>

<!-- =========================
     الافتتاح
========================= -->

<div class="opening" id="opening">
  <div class="shade"></div>

  <div class="title-box">
    <h1 class="title">زكزك سوري!</h1>
  </div>
</div>


<!-- =========================
     التطبيق
========================= -->

<div id="app">

  <div class="app-overlay"></div>

  <!-- الرئيسية -->
  <section class="screen home" id="homeScreen">

    <button class="corner-btn shop-btn" onclick="openShop()">
      🛒 المتجر
    </button>

    <button class="corner-btn tasks-btn" onclick="openTasks()">
      🎯 المهام
    </button>

    <div class="coin-box">
      🪙 <span id="coinCount">1000</span>
    </div>

    <h1 class="game-name">زكزك سوري!</h1>

    <button class="start-btn" onclick="showStages()">
      ابدأ اللعبة
    </button>

  </section>


  <!-- المراحل -->
  <section class="screen stage-screen hidden" id="stageScreen">

    <button class="back-btn" onclick="goHome()">رجوع</button>

    <h2 class="stage-title">اختر المرحلة</h2>

    <div class="stage-grid" id="stageGrid"></div>

  </section>


  <!-- السؤال -->
  <section class="screen question-screen hidden" id="questionScreen">

    <div class="question-top">
      <button class="back-btn" onclick="showStages()">المراحل</button>
      <div class="timer" id="timer">10</div>
    </div>

    <div class="question-card">

      <div id="questionContent"></div>

      <div id="result" class="result"></div>

      <button id="nextBtn" class="next-btn hidden" onclick="nextQuestion()">
        السؤال التالي
      </button>

    </div>

  </section>


  <!-- المتجر -->
  <div class="modal hidden" id="shopModal">

    <div class="modal-card">

      <button class="close-btn" onclick="closeShop()">×</button>

      <h2 class="modal-title">🛒 متجر الخلفيات</h2>

      <div class="shop-grid" id="shopGrid"></div>

    </div>

  </div>


  <!-- المهام -->
  <div class="modal hidden" id="tasksModal">

    <div class="modal-card">

      <button class="close-btn" onclick="closeTasks()">×</button>

      <h2 class="modal-title">🎯 المهام</h2>

      <div id="tasksContent"></div>

    </div>

  </div>

</div>


<!-- يوتيوب للموسيقى -->
<div id="youtubePlayer"
     style="position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;">
</div>

/* =========================================================
   حالة اللعبة
========================================================= */

let coins = Number(localStorage.getItem("zq_coins"));

if(!Number.isFinite(coins)){
  coins = 1000;
}

let ownedBackgrounds =
  JSON.parse(localStorage.getItem("zq_backgrounds") || "[0]");

let selectedBackground =
  Number(localStorage.getItem("zq_selected_background") || 0);

let completedStages =
  Number(localStorage.getItem("zq_completed_stages") || 0);

let currentStage = 0;
let currentQuestion = 0;
let timerInterval = null;
let timeLeft = 10;
let questionLocked = false;

let draggedName = null;
let matchAssignments = {};

let sortDragged = null;

let musicPlayer = null;
let musicPlaying = false;


/* =========================================================
   العناصر
========================================================= */

const opening = document.getElementById("opening");
const app = document.getElementById("app");
const coinCount = document.getElementById("coinCount");

const homeScreen = document.getElementById("homeScreen");
const stageScreen = document.getElementById("stageScreen");
const questionScreen = document.getElementById("questionScreen");

const questionContent = document.getElementById("questionContent");
const resultBox = document.getElementById("result");
const nextBtn = document.getElementById("nextBtn");
const timerEl = document.getElementById("timer");


/* =========================================================
   الافتتاح
========================================================= */

setTimeout(()=>{
  opening.classList.add("hide");

  setTimeout(()=>{
    opening.style.display="none";
  },700);

},2200);


/* =========================================================
   الخلفية الحالية
========================================================= */

function applyBackground(){

  if(selectedBackground === 0){

    app.style.backgroundImage =
      'url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRLh2yUrsPS6WAyQyFSYGQ2OI-MFtmrQ4kf_w6hnFsm4g&s=10")';

  }else{

    const bg = backgrounds.find(x=>x.id===selectedBackground);

    if(bg){
      app.style.backgroundImage = `url("${bg.url}")`;
    }

  }
}

applyBackground();


/* =========================================================
   العملات
========================================================= */

function updateCoins(){

  coinCount.textContent = coins;

  localStorage.setItem("zq_coins",coins);

}

updateCoins();


function addCoins(amount){

  coins += amount;

  updateCoins();

}


/* =========================================================
   التنقل
========================================================= */

function hideAllScreens(){

  homeScreen.classList.add("hidden");
  stageScreen.classList.add("hidden");
  questionScreen.classList.add("hidden");

}


function goHome(){

  stopTimer();
  stopMusic();

  hideAllScreens();

  homeScreen.classList.remove("hidden");

}


function showStages(){

  stopTimer();
  stopMusic();

  hideAllScreens();

  stageScreen.classList.remove("hidden");

  renderStages();

}


function renderStages(){

  const grid = document.getElementById("stageGrid");

  grid.innerHTML = "";

  stages.forEach((stage,index)=>{

    const btn = document.createElement("button");

    btn.className = "stage-btn";

    const unlocked =
      index === 0 || index <= completedStages;

    if(!unlocked){
      btn.classList.add("locked");
      btn.innerHTML = `🔒<br>المرحلة ${index+1}`;
    }else{

      if(index < completedStages){
        btn.classList.add("done");
        btn.innerHTML = `✓<br>المرحلة ${index+1}`;
      }else{
        btn.innerHTML = `المرحلة ${index+1}`;
      }

      btn.onclick = ()=>startStage(index);

    }

    grid.appendChild(btn);

  });

}


/* =========================================================
   بدء المرحلة
========================================================= */

function startStage(index){

  currentStage = index;
  currentQuestion = 0;

  hideAllScreens();

  questionScreen.classList.remove("hidden");

  renderQuestion();

}


/* =========================================================
   السؤال الحالي
========================================================= */

function getCurrentQuestion(){

  return stages[currentStage][currentQuestion];

}


function renderQuestion(){

  stopTimer();
  stopMusic();

  questionLocked = false;

  resultBox.textContent = "";
  resultBox.className = "result";

  nextBtn.classList.add("hidden");

  const q = getCurrentQuestion();

  questionContent.innerHTML = "";

  if(q.image){

    const img = document.createElement("img");

    img.src = q.image;

    img.className =
      q.type === "imageChoice"
      ? "image-question"
      : "image-question normal-image";

    questionContent.appendChild(img);

  }

  const text = document.createElement("div");

  text.className = "question-text";

  text.textContent = q.q;

  questionContent.appendChild(text);


  if(q.music){

    const controls = document.createElement("div");

    controls.className = "music-controls";

    const button = document.createElement("button");

    button.className = "music-btn";

    button.textContent = "🎵 تشغيل الموسيقى";

    button.onclick = ()=>{

      if(musicPlaying){
        stopMusic();
        button.textContent = "🎵 تشغيل الموسيقى";
      }else{
        playMusic(q.music);
        button.textContent = "⏸️ إيقاف الموسيقى";
      }

    };

    controls.appendChild(button);

    questionContent.appendChild(controls);

  }


  if(q.type === "choice"){

    renderChoice(q);

  }else if(q.type === "imageChoice"){

    renderImageChoice(q);

  }else if(q.type === "text"){

    renderTextQuestion(q);

  }else if(q.type === "match"){

    renderMatch(q);

  }else if(q.type === "sort"){

    renderSort(q);

  }


  const duration =
    q.type === "match" ? 30 : 10;

  startTimer(duration);

}


/* =========================================================
   اختيار
========================================================= */

function renderChoice(q){

  const answers = document.createElement("div");

  answers.className = "answers";

  q.options.forEach((option,index)=>{

    const btn = document.createElement("button");

    btn.className = "answer-btn";

    btn.textContent = option;

    btn.onclick = ()=>answerChoice(index,btn);

    answers.appendChild(btn);

  });

  questionContent.appendChild(answers);

}


function answerChoice(index,btn){

  if(questionLocked)return;

  questionLocked = true;

  stopTimer();

  const q = getCurrentQuestion();

  const buttons =
    document.querySelectorAll(".answer-btn");

  buttons.forEach(b=>b.disabled=true);

  if(index === q.correct){

    btn.classList.add("correct");

    showCorrect();

  }else{

    btn.classList.add("wrong");

    if(buttons[q.correct]){
      buttons[q.correct].classList.add("correct");
    }

    showWrong();

  }

}

function answerImage(index,btn){

  if(questionLocked)return;

  questionLocked = true;

  stopTimer();

  const q = getCurrentQuestion();

  const all =
    document.querySelectorAll(".image-answer");

  all.forEach(x=>x.disabled=true);

  if(index===q.correct){

    btn.classList.add("correct");

    showCorrect();

/* =========================================================
   إجابة كتابية
========================================================= */

function normalizeText(text){

  return text
    .trim()
    .toLowerCase()
    .replace(/[إأآ]/g,"ا")
    .replace(/ة/g,"ه")
    .replace(/ى/g,"ي")
    .replace(/[ًٌٍَُِّْـ]/g,"")
    .replace(/\s+/g," ");

}


function renderTextQuestion(q){

  const input =
    document.createElement("input");

  input.className = "text-answer";

  input.placeholder =
    "اكتب إجابتك هنا...";

  const submit =
    document.createElement("button");

  submit.className = "submit-btn";

  submit.textContent = "تأكيد";

  submit.onclick = ()=>{

    if(questionLocked)return;

    const answer =
      normalizeText(input.value);

    const accepted =
      q.accepted.map(normalizeText);

    if(!answer){
      return;
    }

    questionLocked=true;

    stopTimer();

    if(accepted.includes(answer)){

      showCorrect();

    }else{

      showWrong();

    }

  };

  input.addEventListener("keydown",e=>{

    if(e.key==="Enter"){
      submit.click();
    }

  });

  questionContent.appendChild(input);

  questionContent.appendChild(submit);

}


/* =========================================================
   التوصيل
========================================================= */

function shuffleArray(array){

  const a=[...array];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;

}


function renderMatch(q){

  matchAssignments = {};

  const layout =
    document.createElement("div");

  layout.className="match-layout";

  const names =
    shuffleArray(q.pairs);

  const images =
    shuffleArray(q.pairs);

  const namesCol =
    document.createElement("div");

  namesCol.className="match-column";

  const imagesCol =
    document.createElement("div");

  imagesCol.className="match-column";


  names.forEach(pair=>{

    const item =
      document.createElement("div");

    item.className="match-item";

    item.textContent=pair.name;

    item.draggable=true;

    item.dataset.name=pair.name;

    item.addEventListener("dragstart",()=>{

      draggedName=pair.name;

      item.classList.add("dragging");

    });

    item.addEventListener("dragend",()=>{

      item.classList.remove("dragging");

    });

    namesCol.appendChild(item);

  });


  images.forEach(pair=>{

    const item =
      document.createElement("div");

    item.className=
      "match-item match-image";

    item.dataset.answer=pair.name;

    const img =
      document.createElement("img");

    img.src=pair.image;

    item.appendChild(img);

    item.addEventListener("dragover",e=>{
      e.preventDefault();
    });

    item.addEventListener("drop",e=>{

      e.preventDefault();

      if(questionLocked)return;

      if(draggedName){

        matchAssignments[pair.name]=draggedName;

        item.style.borderColor="var(--gold)";

        draggedName=null;

      }

    });

    imagesCol.appendChild(item);

  });


  layout.appendChild(namesCol);

  layout.appendChild(imagesCol);

  questionContent.appendChild(layout);


  const submit =
    document.createElement("button");

  submit.className="match-submit";

  submit.textContent="تأكيد الإجابات";

  submit.onclick=checkMatch;

  questionContent.appendChild(submit);

}


function checkMatch(){

  if(questionLocked)return;

  const q=getCurrentQuestion();

  let correct=true;

  q.pairs.forEach(pair=>{

    if(matchAssignments[pair.name]!==pair.name){

      correct=false;

    }

  });

  questionLocked=true;

  stopTimer();

  if(correct){

    document.querySelectorAll(".match-image")
      .forEach(x=>x.classList.add("correct-match"));

    showCorrect();

  }else{

    showWrong();

  }

}


/* =========================================================
   ترتيب
========================================================= */

function renderSort(q){

  const list =
    document.createElement("div");

  list.className="sort-list";

  const shuffled =
    shuffleArray(q.items);

  shuffled.forEach(name=>{

    const item =
      document.createElement("div");

    item.className="sort-item";

    item.textContent=name;

    item.draggable=true;

    item.dataset.name=name;

    item.addEventListener("dragstart",()=>{
      sortDragged=item;
    });

    item.addEventListener("dragover",e=>{
      e.preventDefault();
    });

    item.addEventListener("drop",e=>{

      e.preventDefault();

      if(sortDragged && sortDragged!==item){

        const rect =
          item.getBoundingClientRect();

        const after =
          e.clientY > rect.top + rect.height/2;

        if(after){
          item.after(sortDragged);
        }else{
          item.before(sortDragged);
        }

      }

    });

    list.appendChild(item);

  });

  questionContent.appendChild(list);


  const submit =
    document.createElement("button");

  submit.className="match-submit";

  submit.textContent="تأكيد الترتيب";

  submit.onclick=checkSort;

  questionContent.appendChild(submit);

}


function checkSort(){

  if(questionLocked)return;

  const q=getCurrentQuestion();

  const items =
    [...document.querySelectorAll(".sort-item")]
      .map(x=>x.dataset.name);

  questionLocked=true;

  stopTimer();

  const correct =
    items.every((x,i)=>x===q.correct[i]);

  if(correct){

    showCorrect();

  }else{

    showWrong();

  }

}

/* =========================================================
   المؤقت
========================================================= */

function startTimer(seconds){

  stopTimer();

  timeLeft=seconds;

  timerEl.textContent=timeLeft;

  timerInterval=setInterval(()=>{

    timeLeft--;

    timerEl.textContent=timeLeft;

    if(timeLeft<=0){

      stopTimer();

      if(!questionLocked){

        questionLocked=true;

        resultBox.textContent="⏰ انتهى الوقت!";

        resultBox.className="result bad";

        nextBtn.classList.remove("hidden");

      }

    }

  },1000);

}


function stopTimer(){

  if(timerInterval){

    clearInterval(timerInterval);

    timerInterval=null;

  }

}

function nextQuestion(){

  stopTimer();
  stopMusic();

  currentQuestion++;

function renderShop(){

    item.className="shop-item";

    const owned =
      ownedBackgrounds.includes(bg.id);

    item.innerHTML=`

      <img src="${bg.url}" alt="${bg.name}">

      <button
        class="buy-btn ${owned ? "owned":""}"

        ${owned ? "✓ مملوكة" : `🪙 ${bg.price}`}

    `;

function buyBackground(id){

  const bg =
    backgrounds.find(x=>x.id===id);

  if(!bg)return;

  if(ownedBackgrounds.includes(id)){

    selectBackground(id);

    return;

  }

  if(coins<bg.price){

    alert("ما معك زكزكات كافية 😅");

    return;

  }

  coins-=bg.price;

  ownedBackgrounds.push(id);

  localStorage.setItem(
    "zq_backgrounds",
    JSON.stringify(ownedBackgrounds)
  );

  updateCoins();

  selectBackground(id);

  renderShop();

}


function selectBackground(id){

  selectedBackground=id;

  localStorage.setItem(
    "zq_selected_background",
    id
  );

  applyBackground();

  renderShop();

}

function loadYouTubeAPI(){

  if(window.YT && window.YT.Player){

    createYouTubePlayer();

    return;

  }

  const tag =
    document.createElement("script");

  tag.src=
    "https://www.youtube.com/iframe_api";

  document.head.appendChild(tag);

}


function onYouTubeIframeAPIReady(){

  createYouTubePlayer();

}


function createYouTubePlayer(){

  if(musicPlayer)return;

  musicPlayer =
    new YT.Player("youtubePlayer",{

      height:"1",
      width:"1",

      videoId:"7kR1TX6O6B4",

      playerVars:{
        autoplay:0,
        controls:0,
        loop:1,
        playlist:"7kR1TX6O6B4"
      }

    });

}


function playMusic(videoId){

  loadYouTubeAPI();

  setTimeout(()=>{

    if(musicPlayer){

      musicPlayer.loadVideoById(videoId);

      musicPlayer.playVideo();

      musicPlaying=true;

    }

  },700);

}


function stopMusic(){

  if(musicPlayer){

    try{
      musicPlayer.stopVideo();
    }catch(e){}

  }

  musicPlaying=false;

}
