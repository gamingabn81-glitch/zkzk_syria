<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>زكزك سوري</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111;
      font-family: "Aref Ruqaa", serif;
    }

    /* خلفية النخيل */
    .opening {
      width: 100%;
      height: 100%;
      position: relative;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.08)
        ),
        url("palm.jpg");

      background-size: cover;
      background-position: center;
    }

    /* طبقة خفيفة حتى تكون الكتابة مريحة */
    .shade {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.05);
    }

    /* بطاقة العنوان */
    .title-box {
      position: absolute;
      top: 45%;
      left: 50%;

      transform:
        translate(-50%, -50%)
        rotate(-4deg);

      background: white;
      color: black;

      min-width: 300px;
      padding: 18px 45px;

      border-radius: 22px;

      text-align: center;

      box-shadow:
        0 12px 30px rgba(0,0,0,0.20);

      animation: appear 1.4s ease-out forwards;
    }

    .title {
      margin: 0;
      font-size: clamp(45px, 9vw, 90px);
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    /* حركة ظهور ناعمة */
    @keyframes appear {
      0% {
        opacity: 0;
        transform:
          translate(-50%, -35%)
          rotate(-8deg)
          scale(0.85);
      }

      70% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          rotate(-4deg)
          scale(1.03);
      }

      100% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          rotate(-4deg)
          scale(1);
      }
    }
  </style>
</head>

<body>

  <main class="opening">
    <div class="shade"></div>

    <div class="title-box">
      <h1 class="title">زكزك سوري</h1>
    </div>
  </main>

</body>
</html>
